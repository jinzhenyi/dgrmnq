name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Copy web assets
      run: |
        mkdir -p android-template/app/src/main/assets/www
        cp index.html android-template/app/src/main/assets/www/
        cp -r css android-template/app/src/main/assets/www/
        cp -r js android-template/app/src/main/assets/www/

    - name: Download Gradle Wrapper
      working-directory: android-template
      run: |
        mkdir -p gradle/wrapper
        curl -L -o gradle/wrapper/gradle-wrapper.jar \
          https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar

    - name: Generate Keystore for Signing
      working-directory: android-template
      run: |
        mkdir -p keystore
        keytool -genkey -v -keystore keystore/release-key.jks \
          -alias release \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=2048 Game, OU=Game, O=2048, L=City, S=State, C=US"

    - name: Build Unsigned APK
      working-directory: android-template
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon

    - name: Setup Signing Key
      working-directory: android-template
      run: |
        mkdir -p keystore
        if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
          echo "Using custom keystore from secrets"
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystore/release-key.jks
        else
          echo "Generating temporary keystore (for testing only)"
          keytool -genkey -v -keystore keystore/release-key.jks \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=2048 Game, OU=Game, O=2048, L=City, S=State, C=US"
        fi
        
    - name: Sign APK
      working-directory: android-template
      run: |
        STORE_PASS="${{ secrets.RELEASE_STORE_PASSWORD }}"
        KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}"
        KEY_PASS="${{ secrets.RELEASE_KEY_PASSWORD }}"
        
        # Use defaults if secrets not set (for auto-generated keystore)
        : ${STORE_PASS:=android}
        : ${KEY_ALIAS:=release}
        : ${KEY_PASS:=android}
        
        $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 \
          app/build/outputs/apk/release/app-release-unsigned.apk \
          app-release-aligned.apk
        
        $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
          --ks keystore/release-key.jks \
          --ks-key-alias "$KEY_ALIAS" \
          --ks-pass "pass:$STORE_PASS" \
          --key-pass "pass:$KEY_PASS" \
          app-release-aligned.apk
        
        mv app-release-aligned.apk app/build/outputs/apk/release/app-release.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: 2048-game
        path: android-template/app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error
