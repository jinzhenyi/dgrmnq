name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Copy web assets
      run: |
        mkdir -p android-template/app/src/main/assets/www
        cp index.html android-template/app/src/main/assets/www/
        cp -r css android-template/app/src/main/assets/www/
        cp -r js android-template/app/src/main/assets/www/

    - name: Download Gradle Wrapper
      working-directory: android-template
      run: |
        mkdir -p gradle/wrapper
        curl -L -o gradle/wrapper/gradle-wrapper.jar \
          https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar

    - name: Build Unsigned APK
      working-directory: android-template
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon

    - name: Setup Signing Key
      working-directory: android-template
      run: |
        mkdir -p keystore
        if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
          echo "Using signing key from secrets"
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" > keystore/signing-key.txt
          if grep -q -- "-----BEGIN" keystore/signing-key.txt; then
            # PEM format: extract private key and certificate
            cp keystore/signing-key.txt keystore/signing.pem
            openssl pkcs8 -topk8 -nocrypt \
              -in keystore/signing.pem \
              -out keystore/private_key.pem 2>/dev/null || \
              openssl pkey -in keystore/signing.pem -out keystore/private_key.pem
            openssl x509 -in keystore/signing.pem -out keystore/cert.pem
          else
            # JKS format: decode base64
            base64 -d keystore/signing-key.txt > keystore/release-key.jks
          fi
        else
          echo "Generating temporary keystore (for testing only)"
          keytool -genkeypair -v -keystore keystore/release-key.jks \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=2048 Game, OU=Game, O=2048, L=City, S=State, C=US"
        fi

    - name: Sign APK
      working-directory: android-template
      run: |
        $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 \
          app/build/outputs/apk/release/app-release-unsigned.apk \
          app-release-aligned.apk

        if [ -f keystore/private_key.pem ]; then
          # Sign with PEM private key and certificate
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --key keystore/private_key.pem \
            --cert keystore/cert.pem \
            --out app-release-signed.apk \
            app-release-aligned.apk
        else
          # Sign with JKS keystore
          STORE_PASS="${{ secrets.RELEASE_STORE_PASSWORD }}"
          KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}"
          KEY_PASS="${{ secrets.RELEASE_KEY_PASSWORD }}"
          
          : ${STORE_PASS:=android}
          : ${KEY_ALIAS:=release}
          : ${KEY_PASS:=android}
          
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks keystore/release-key.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out app-release-signed.apk \
            app-release-aligned.apk
        fi
        
        mv app-release-signed.apk app/build/outputs/apk/release/app-release.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: 2048-game
        path: android-template/app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error
