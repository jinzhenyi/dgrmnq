name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Copy web assets
      run: |
        mkdir -p android-template/app/src/main/assets/www
        cp index.html android-template/app/src/main/assets/www/
        cp -r css android-template/app/src/main/assets/www/
        cp -r js android-template/app/src/main/assets/www/

    - name: Download Gradle Wrapper
      working-directory: android-template
      run: |
        mkdir -p gradle/wrapper
        curl -L -o gradle/wrapper/gradle-wrapper.jar \
          https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar

    - name: Build Unsigned APK
      working-directory: android-template
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon

    - name: Sign APK with JKS
      working-directory: android-template
      env:
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: |
        STORE_PASS="${RELEASE_STORE_PASSWORD:-android}"
        KEY_ALIAS="${RELEASE_KEY_ALIAS:-release}"
        KEY_PASS="${RELEASE_KEY_PASSWORD:-android}"
        
        $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 \
          app/build/outputs/apk/release/app-release-unsigned.apk \
          app-release-aligned.apk
        
        $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
          --ks keystore/release-key.jks \
          --ks-key-alias "$KEY_ALIAS" \
          --ks-pass "pass:$STORE_PASS" \
          --key-pass "pass:$KEY_PASS" \
          --out app-release-signed.apk \
          app-release-aligned.apk
        
        mv app-release-signed.apk app/build/outputs/apk/release/app-release.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: 2048-game
        path: android-template/app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error
