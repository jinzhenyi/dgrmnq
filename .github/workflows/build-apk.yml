name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Copy web assets
      run: |
        mkdir -p android-template/app/src/main/assets/www
        cp index.html android-template/app/src/main/assets/www/
        cp -r css android-template/app/src/main/assets/www/
        cp -r js android-template/app/src/main/assets/www/

    - name: Download Gradle Wrapper
      working-directory: android-template
      run: |
        mkdir -p gradle/wrapper
        curl -L -o gradle/wrapper/gradle-wrapper.jar \
          https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar

    - name: Build APK
      working-directory: android-template
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: 2048-game
        path: android-template/app/build/outputs/apk/release/app-release-unsigned.apk
        if-no-files-found: error
